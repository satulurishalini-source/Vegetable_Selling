<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshFarm - Farmer Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f8; color: #333; padding-bottom: 50px; }
        .top-bar { background-color: #f8f9fa; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e0e0e0; }
        .brand { font-size: 20px; font-weight: bold; color: #1a7f37; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .card { background: #ffffff; border-radius: 6px; border: 1px solid #e5e7eb; margin-bottom: 20px; padding: 18px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card-header { font-size: 16px; font-weight: 600; margin-bottom: 15px; color: #212529; }
        .order-notification-box { background-color: #fffbeb; border: 1px dashed #f59e0b; border-radius: 6px; padding: 15px; text-align: center; }
        .title { color: #d97706; font-weight: bold; margin-bottom: 8px; }
        .btn-accept { background-color: #1a7f37; color: white; border: none; padding: 10px 18px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 12px; }
        .status-success-banner { color: #166534; font-size: 14px; display: flex; align-items: center; gap: 8px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="brand">🌱 FreshFarm - Farmer Dashboard</div>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-header">📊 Live Customer Orders</div>

            <div id="order-box" class="order-notification-box">
                <div class="title">🔔 New Order Received!</div>
                <p style="font-size: 14px; color: #374151;"><strong>Items:</strong> cabbage, chilli, brinjal, cucumber, lady finger, onion | <strong>Total:</strong> ₹223.00</p>
                <p style="font-size: 13px; color: #4b5563; margin-top: 4px;"><strong>Tracking Code:</strong> FF-APRV-9376</p>
                <button class="btn-accept" onclick="acceptOrder()">Accept Order & Send SMS ✔️</button>
            </div>

            <div id="order-accepted-banner" class="status-success-banner" style="display: none;">
                <span style="color: #16a34a; font-weight: bold;">☑</span> Last order accepted successfully. SMS Bill Sent!
            </div>
        </div>
    </div>

    <script>
        function acceptOrder() {
            // 1. Prepare accepted order object
            const orderData = {
                code: 'FF-APRV-9376',
                items: 'cabbage, chilli, brinjal, cucumber, lady finger, onion',
                total: '223.00',
                status: 'ACCEPTED',
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            // 2. Save under ALL possible keys so customer.html catches it guaranteed
            localStorage.setItem('currentOrder', JSON.stringify(orderData));
            localStorage.setItem('freshfarm_order', JSON.stringify(orderData));
            localStorage.setItem('orderAccepted', 'true');

            // 3. Update Farmer UI
            document.getElementById('order-box').style.display = 'none';
            document.getElementById('order-accepted-banner').style.display = 'flex';
        }
    </script>
</body>
</html>
