<div class="container" style="padding: 20px;">
    <h2>Farmer Panel - Incoming Orders (కస్టమర్ ఆర్డర్లు)</h2>
    
    <table border="1" cellpadding="10" style="width: 100%; border-collapse: collapse; text-align: left;">
        <thead>
            <tr style="background-color: #f2f2f2;">
                <th>S.No</th>
                <th>Customer Name</th>
                <th>Mobile Number</th>
                <th>Items Ordered</th>
                <th>Bill Amount</th>
                <th>Action (చర్య)</th>
            </tr>
        </thead>
        <tbody id="farmerTableBody">
            <!-- JavaScript will auto-inject rows here -->
        </tbody>
    </table>
</div>

<script>
// Page load అవ్వగానే ఆర్డర్లను చూపించడానికి
document.addEventListener("DOMContentLoaded", displayOrdersForFarmer);

function displayOrdersForFarmer() {
    let orderQueue = JSON.parse(localStorage.getItem('farmerOrderQueue')) || [];
    let tableBody = document.getElementById('farmerTableBody');
    
    if(!tableBody) return;
    tableBody.innerHTML = ''; // Clear previous old rows

    let pendingCount = 0;

    orderQueue.forEach((order) => {
        if(order.status === 'Pending') {
            pendingCount++;
            let row = `
                <tr>
                    <td>${pendingCount}</td>
                    <td>${order.customerName}</td>
                    <td>${order.customerPhone}</td>
                    <td>${order.items}</td>
                    <td>₹${order.billAmount}</td>
                    <td>
                        <button onclick="acceptOrder('${order.orderId}')" style="background-color: #007bff; color: white; padding: 5px 10px; border: none; cursor: pointer; border-radius: 3px;">
                            Accept (ఆమోదించు)
                        </button>
                    </td>
                </tr>
            `;
            tableBody.innerHTML += row;
        }
    });

    if(pendingCount === 0) {
        tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No pending orders found (ఏ ఆర్డర్లు లేవు).</td></tr>`;
    }
}

function acceptOrder(orderId) {
    let orderQueue = JSON.parse(localStorage.getItem('farmerOrderQueue')) || [];
    
    // Find item and update its status
    orderQueue = orderQueue.map(order => {
        if(order.orderId === orderId) {
            order.status = 'Accepted';
        }
        return order;
    });
    
    localStorage.setItem('farmerOrderQueue', JSON.stringify(orderQueue));
    alert("Order Accepted! Added to Admin Master List.");
    
    // Refresh the table layout dynamically
    displayOrdersForFarmer();
}
</script>
