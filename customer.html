<div class="container" style="padding: 20px;">
    <h2>Customer Shopping Cart (కార్ట్)</h2>
    
    <!-- Sample Form inputs to simulate cart -->
    <div style="margin-bottom: 15px;">
        <label>Customer Name: </label>
        <input type="text" id="custName" value="Suresh Babu" placeholder="Enter name">
    </div>
    <div style="margin-bottom: 15px;">
        <label>Mobile Number: </label>
        <input type="text" id="custPhone" value="8123456789" placeholder="Enter mobile">
    </div>
    <div style="margin-bottom: 15px;">
        <label>Select Item: </label>
        <select id="cartItem">
            <option value="Tomatoes - 10kg">Tomatoes - 10kg</option>
            <option value="Onions - 5kg">Onions - 5kg</option>
        </select>
    </div>
    <div style="margin-bottom: 15px;">
        <label>Total Price (ధర): </label>
        <input type="number" id="itemPrice" value="500">
    </div>

    <button onclick="placeCustomerOrder()" style="background-color: #28a745; color: white; padding: 10px 20px; border: none; cursor: pointer; border-radius: 5px;">
        Place Order to Farmer (ఆర్డర్ పంపించు)
    </button>
</div>

<script>
function placeCustomerOrder() {
    let name = document.getElementById('custName').value;
    let phone = document.getElementById('custPhone').value;
    let item = document.getElementById('cartItem').value;
    let price = document.getElementById('itemPrice').value;

    if(!name || !phone) {
        alert("Please enter Name and Phone!");
        return;
    }

    // Existing orders list loading
    let orderQueue = JSON.parse(localStorage.getItem('farmerOrderQueue')) || [];

    // Creating new order details object
    let newOrder = {
        orderId: 'ORD-' + Date.now(),
        customerName: name,
        customerPhone: phone,
        items: item,
        billAmount: price,
        status: 'Pending'
    };

    orderQueue.push(newOrder);
    localStorage.setItem('farmerOrderQueue', JSON.stringify(orderQueue));
    alert("Order Sent to Farmer Successfully! (రైతుకు ఆర్డర్ పంపబడింది)");
}
</script>
