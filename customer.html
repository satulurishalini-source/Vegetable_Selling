<script>

const CART_KEY_PREFIX = "freshfarm_cart_";

let custUser = getCurrentUser();

if (!custUser) {
    window.location.href = "login.html";
} else {
    document.getElementById("custNameDisplay").innerText = custUser.name;
}


/* =========================================================
   CART FUNCTIONS
========================================================= */

function getCartKey() {
    return CART_KEY_PREFIX + custUser.mobile;
}


function getCart() {

    try {
        return JSON.parse(
            localStorage.getItem(getCartKey())
        ) || [];

    } catch (error) {
        return [];
    }
}


function saveCart(cart) {

    localStorage.setItem(
        getCartKey(),
        JSON.stringify(cart)
    );
}


/* =========================================================
   ADD VEGETABLE TO CART
========================================================= */

function addToCart(vegId) {

    const vegetables =
        JSON.parse(
            localStorage.getItem("veg_market_vegetables")
        ) || [];

    const vegetable =
        vegetables.find(
            v => Number(v.id) === Number(vegId)
        );

    if (!vegetable) {
        alert("Vegetable not found.");
        return;
    }

    if (Number(vegetable.quantityKg) <= 0) {
        alert("This vegetable is out of stock.");
        displayMarketVegetables();
        return;
    }


    const quantityInput =
        document.getElementById("qty-" + vegId);

    const quantity =
        parseFloat(quantityInput.value);


    if (isNaN(quantity) || quantity <= 0) {
        alert("Please enter a valid quantity.");
        return;
    }


    if (quantity > Number(vegetable.quantityKg)) {
        alert(
            "Requested quantity is greater than available stock."
        );
        return;
    }


    let cart = getCart();


    /*
        IMPORTANT FIX:

        Instead of storing only ONE vegetable,
        we keep every vegetable inside the cart array.
    */

    const existingItem =
        cart.find(
            item =>
                Number(item.vegId) === Number(vegetable.id)
        );


    if (existingItem) {

        const newQuantity =
            Number(existingItem.quantity) + quantity;


        if (
            newQuantity >
            Number(vegetable.quantityKg)
        ) {
            alert(
                "Cart quantity cannot exceed available stock."
            );
            return;
        }


        existingItem.quantity = newQuantity;

    } else {

        cart.push({

            vegId: vegetable.id,

            name: vegetable.name,

            price: Number(
                vegetable.pricePerKg
            ),

            quantity: quantity,

            farmerName: vegetable.farmerName,

            farmerMobile: vegetable.farmerMobile

        });

    }


    saveCart(cart);

    quantityInput.value = 1;

    renderCart();

    alert(
        vegetable.name +
        " added to cart."
    );
}
