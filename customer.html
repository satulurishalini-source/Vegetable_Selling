<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vegetable Market Checkout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fcfcfc;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .header {
            color: #2e7d32;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .product-card {
            border-bottom: 1px solid #eeeeee;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .product-title {
            color: #2e7d32;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        .product-info {
            font-size: 14px;
            color: #444444;
            line-height: 1.5;
            margin-bottom: 12px;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .quantity-field {
            width: 70px;
            padding: 6px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .unit-dropdown {
            padding: 6px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            background-color: #ffffff;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-add-cart {
            background-color: #2e7d32;
            color: #ffffff;
            border: none;
            padding: 7px 15px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-add-cart:hover {
            background-color: #1b5e20;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">Available Market Vegetables</div>

    <!-- Tomatoes Card -->
    <div class="product-card" id="item-tomatoes">
        <div class="product-title">🥦 tomatoes</div>
        <div class="product-info">
            Price: ₹<span class="base-price">25</span> / KG<br>
            Stock: 1 KG<br>
            Farmer: shalini
        </div>
        <div class="controls">
            <input type="number" class="quantity-field" value="500" min="1">
            <select class="unit-dropdown">
                <option value="Grams">Grams</option>
                <option value="KG">KG</option>
            </select>
            <button class="btn-add-cart" onclick="addToCart('item-tomatoes')">Add to Cart</button>
        </div>
    </div>

    <!-- Potatoes Card -->
    <div class="product-card" id="item-potatoes">
        <div class="product-title">🥦 potatoes</div>
        <div class="product-info">
            Price: ₹<span class="base-price">49</span> / KG<br>
            Stock: 60 KG<br>
            Farmer: shalini
        </div>
        <div class="controls">
            <input type="number" class="quantity-field" value="250" min="1">
            <select class="unit-dropdown">
                <option value="Grams">Grams</option>
                <option value="KG">KG</option>
            </select>
            <button class="btn-add-cart" onclick="addToCart('item-potatoes')">Add to Cart</button>
        </div>
    </div>
</div>

<script>
function addToCart(productId) {
    const card = document.getElementById(productId);
    const name = card.querySelector('.product-title').innerText;
    const pricePerKg = parseFloat(card.querySelector('.base-price').innerText);
    const quantity = parseFloat(card.querySelector('.quantity-field').value);
    const unit = card.querySelector('.unit-dropdown').value;

    let finalPrice = 0;

    if (unit === "Grams") {
        // Divide by 1000 to convert grams input to its KG price equivalent
        finalPrice = (quantity / 1000) * pricePerKg;
    } else {
        finalPrice = quantity * pricePerKg;
    }

    alert(`Item: ${name}\nQuantity: ${quantity} ${unit}\nTotal Calculated Price: ₹${finalPrice.toFixed(2)}`);
}
</script>

</body>
</html>
