<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshFarm - Customer Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
        }

        .navbar {
            background: #2e7d32;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 25px auto;
        }

        h2 {
            color: #2e7d32;
        }

        .vegetables {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .vegetable-card {
            background: white;
            padding: 18px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .vegetable-card h3 {
            margin-top: 0;
        }

        .price {
            color: #2e7d32;
            font-weight: bold;
        }

        .quantity {
            width: 80px;
            padding: 8px;
            margin: 8px 0;
        }

        .add-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #388e3c;
        }

        .cart {
            background: white;
            padding: 20px;
            margin-top: 30px;
            border-radius: 8px;
        }

        .cart-item {
            background: #fafafa;
            padding: 14px;
            border-left: 5px solid #ff9800;
            border-radius: 5px;
            margin-top: 10px;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .remove-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .grand-total {
            background: #e8f5e9;
            border: 2px solid #4caf50;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #2e7d32;
        }

        .place-order {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }

        .empty {
            color: #999;
            font-style: italic;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <h1>🌱 FreshFarm</h1>
    <p>Customer Dashboard</p>
</div>


<div class="container">

    <!-- AVAILABLE VEGETABLES -->
    <h2>🥕 Available Vegetables</h2>

    <div class="vegetables">

        <!-- 1 Tomato -->
        <div class="vegetable-card">
            <h3>🍅 Tomato</h3>
            <p class="price">₹40 / kg</p>

            <input
                type="number"
                id="qtyTomato"
                class="quantity"
                value="1"
                min="0.1"
                step="0.1"
            >

            <button
                class="add-btn"
                onclick="addToCart('Tomato', 40, 'qtyTomato')">
                🛒 Add to Cart
            </button>
        </div>


        <!-- 2 Potato -->
        <div class="vegetable-card">
            <h3>🥔 Potato</h3>
            <p class="price">₹35 / kg</p>

            <input
                type="number"
                id="qtyPotato"
                class="quantity"
                value="1"
                min="0.1"
                step="0.1"
            >

            <button
                class="add-btn"
                onclick="addToCart('Potato', 35, 'qtyPotato')">
                🛒 Add to Cart
            </button>
        </div>


        <!-- 3 Carrot -->
        <div class="vegetable-card">
            <h3>🥕 Carrot</h3>
            <p class="price">₹60 / kg</p>

            <input
                type="number"
                id="qtyCarrot"
                class="quantity"
                value="1"
                min="0.1"
                step="0.1"
            >

            <button
                class="add-btn"
                onclick="addToCart('Carrot', 60, 'qtyCarrot')">
                🛒 Add to Cart
            </button>
        </div>


        <!-- 4 Onion -->
        <div class="vegetable-card">
            <h3>🧅 Onion</h3>
            <p class="price">₹45 / kg</p>

            <input
                type="number"
                id="qtyOnion"
                class="quantity"
                value="1"
                min="0.1"
                step="0.1"
            >

            <button
                class="add-btn"
                onclick="addToCart('Onion', 45, 'qtyOnion')">
                🛒 Add to Cart
            </button>
        </div>


        <!-- 5 Cabbage -->
        <div class="vegetable-card">
            <h3>🥬 Cabbage</h3>
            <p class="price">₹30 / kg</p>

            <input
                type="number"
                id="qtyCabbage"
                class="quantity"
                value="1"
                min="0.1"
                step="0.1"
            >

            <button
                class="add-btn"
                onclick="addToCart('Cabbage', 30, 'qtyCabbage')">
                🛒 Add to Cart
            </button>
        </div>


        <!-- 6 Brinjal -->
        <div class="vegetable-card">
            <h3>🍆 Brinjal</h3>
            <p class="price">₹50 / kg</p>

            <input
                type="number"
                id="qtyBrinjal"
                class="quantity"
                value="1"
                min="0.1"
                step="0.1"
            >

            <button
                class="add-btn"
                onclick="addToCart('Brinjal', 50, 'qtyBrinjal')">
                🛒 Add to Cart
            </button>
        </div>


        <!-- 7 Beans -->
        <div class="vegetable-card">
            <h3>🫘 Beans</h3>
            <p class="price">₹70 / kg</p>

            <input
                type="number"
                id="qtyBeans"
                class="quantity"
                value="1"
                min="0.1"
                step="0.1"
            >

            <button
                class="add-btn"
                onclick="addToCart('Beans', 70, 'qtyBeans')">
                🛒 Add to Cart
            </button>
        </div>


        <!-- 8 Beetroot -->
        <div class="vegetable-card">
            <h3>🟣 Beetroot</h3>
            <p class="price">₹55 / kg</p>

            <input
                type="number"
                id="qtyBeetroot"
                class="quantity"
                value="1"
                min="0.1"
                step="0.1"
            >

            <button
                class="add-btn"
                onclick="addToCart('Beetroot', 55, 'qtyBeetroot')">
                🛒 Add to Cart
            </button>
        </div>


        <!-- 9 Spinach -->
        <div class="vegetable-card">
            <h3>🥬 Spinach</h3>
            <p class="price">₹25 / kg</p>

            <input
                type="number"
                id="qtySpinach"
                class="quantity"
                value="0.5"
                min="0.1"
                step="0.1"
            >

            <button
                class="add-btn"
                onclick="addToCart('Spinach', 25, 'qtySpinach')">
                🛒 Add to Cart
            </button>
        </div>


        <!-- 10 Cucumber -->
        <div class="vegetable-card">
            <h3>🥒 Cucumber</h3>
            <p class="price">₹40 / kg</p>

            <input
                type="number"
                id="qtyCucumber"
                class="quantity"
                value="1"
                min="0.1"
                step="0.1"
            >

            <button
                class="add-btn"
                onclick="addToCart('Cucumber', 40, 'qtyCucumber')">
                🛒 Add to Cart
            </button>
        </div>

    </div>


    <!-- CART -->
    <div class="cart">

        <h2>🛒 My Cart</h2>

        <div id="cartSection">
            <p class="empty">
                Your Cart is Empty.
            </p>
        </div>

        <div id="cartTotal"></div>

        <button
            id="placeOrderButton"
            class="place-order"
            style="display:none;"
            onclick="placeOrder()">

            🛒 Place Order

        </button>

    </div>

</div>


<!-- ================================================= -->
<!-- JAVASCRIPT MUST BE INSIDE THIS SCRIPT TAG -->
<!-- ================================================= -->

<script>

let customerCart =
    JSON.parse(
        localStorage.getItem("customerCart")
    ) || [];


// ===============================
// ADD TO CART
// ===============================
function addToCart(name, pricePerKg, quantityId) {

    // Maximum 10 vegetables
    if (customerCart.length >= 10) {

        alert(
            "⚠️ Maximum 10 vegetables allowed in the cart."
        );

        return;
    }


    // Get quantity
    let quantity =
        Number(
            document.getElementById(quantityId).value
        );


    // Check quantity
    if (!quantity || quantity <= 0) {

        alert(
            "⚠️ Please enter a valid quantity."
        );

        return;
    }


    // Check duplicate
    let existingVegetable =
        customerCart.find(
            function(item) {
                return item.name === name;
            }
        );


    if (existingVegetable) {

        alert(
            "⚠️ " + name +
            " is already in your cart."
        );

        return;
    }


    // Add vegetable
    customerCart.push({

        name: name,

        pricePerKg:
            Number(pricePerKg),

        quantityKg:
            Number(quantity)

    });


    saveCart();

    displayCart();

    alert(
        "✅ " + name +
        " added to cart!\n\n" +
        customerCart.length +
        "/10 vegetables added."
    );
}


// ===============================
// SAVE CART
// ===============================
function saveCart() {

    localStorage.setItem(
        "customerCart",
        JSON.stringify(customerCart)
    );

}


// ===============================
// DISPLAY CART
// ===============================
function displayCart() {

    let cartSection =
        document.getElementById("cartSection");

    let cartTotal =
        document.getElementById("cartTotal");

    let orderButton =
        document.getElementById("placeOrderButton");


    // Empty cart
    if (customerCart.length === 0) {

        cartSection.innerHTML = `
            <p class="empty">
                Your Cart is Empty.
            </p>
        `;

        cartTotal.innerHTML = "";

        orderButton.style.display = "none";

        return;
    }


    cartSection.innerHTML = "";

    let grandTotal = 0;


    // Display vegetables
    customerCart.forEach(
        function(item, index) {

            let subtotal =
                Number(item.quantityKg) *
                Number(item.pricePerKg);


            grandTotal += subtotal;


            let quantityText;


            // Display grams if less than 1 KG
            if (Number(item.quantityKg) < 1) {

                quantityText =
                    (
                        Number(item.quantityKg) *
                        1000
                    ).toFixed(0) + " g";

            } else {

                quantityText =
                    Number(item.quantityKg)
                    .toFixed(3) + " KG";
            }


            cartSection.innerHTML += `

                <div class="cart-item">

                    <div class="cart-header">

                        <strong style="font-size:18px;">

                            ${index + 1}.
                            🥦 ${item.name}

                        </strong>


                        <button
                            class="remove-btn"
                            onclick="removeFromCart(${index})">

                            ❌ Remove

                        </button>

                    </div>


                    <p>
                        <strong>Quantity:</strong>
                        ${quantityText}
                    </p>


                    <p>
                        <strong>Price:</strong>
                        ₹${Number(
                            item.pricePerKg
                        ).toFixed(2)} / kg
                    </p>


                    <p>
                        <strong>Subtotal:</strong>
                        ₹${subtotal.toFixed(2)}
                    </p>

                </div>

            `;
        }
    );


    // GRAND TOTAL
    cartTotal.innerHTML = `

        <div class="grand-total">

            🧾 GRAND TOTAL:
            ₹${grandTotal.toFixed(2)}

            <br>

            <span style="
                font-size:14px;
                color:#555;
            ">

                ${customerCart.length}/10
                vegetables in cart

            </span>

        </div>

    `;


    // Show Place Order button
    orderButton.style.display = "block";
}


// ===============================
// REMOVE FROM CART
// ===============================
function removeFromCart(index) {

    customerCart.splice(index, 1);

    saveCart();

    displayCart();

}


// ===============================
// PLACE ORDER
// ===============================
function placeOrder() {

    if (customerCart.length === 0) {

        alert(
            "⚠️ Your cart is empty."
        );

        return;
    }


    let grandTotal = 0;


    customerCart.forEach(
        function(item) {

            grandTotal +=
                Number(item.quantityKg) *
                Number(item.pricePerKg);

        }
    );


    alert(
        "✅ ORDER PLACED SUCCESSFULLY!\n\n" +

        "🥕 Vegetables: " +
        customerCart.length +

        "\n💰 Total Amount: ₹" +
        grandTotal.toFixed(2)
    );


    // Clear cart after order
    customerCart = [];

    saveCart();

    displayCart();
}


// ===============================
// DISPLAY CART WHEN PAGE OPENS
// ===============================
displayCart();

</script>

</body>
</html>
