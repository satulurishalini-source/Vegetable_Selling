<script src="app.js"></script>


<script>


// ======================================================
// CUSTOMER
// ======================================================

let custUser =
    typeof getCurrentUser === "function"
        ? getCurrentUser()
        : null;


custUser =
    custUser || {
        name: "shalini"
    };


document.getElementById(
    "custNameDisplay"
).innerText = custUser.name;



// ======================================================
// CART
// ======================================================

let customerCart =
    JSON.parse(
        localStorage.getItem("customer_cart")
    ) || [];



// ======================================================
// DISPLAY AVAILABLE VEGETABLES
// ======================================================

function displayMarketVegetables() {

    let vegList =
        JSON.parse(
            localStorage.getItem(
                "veg_market_vegetables"
            )
        ) || [];


    let section =
        document.getElementById(
            "availableVegetablesSection"
        );


    section.innerHTML = "";


    if (vegList.length === 0) {

        section.innerHTML = `

            <p style="color:#777;font-style:italic;">
                మార్కెట్ లో ప్రస్తుతం కూరగాయలు లేవు.
                రైతు Dashboard లో vegetables add చేయండి.
            </p>

        `;

        return;
    }



    vegList.forEach(
        (vegetable, index) => {


            if (
                Number(vegetable.quantityKg) <= 0
            ) {

                return;

            }



            section.innerHTML += `

                <div class="vegetable-card">

                    <div class="vegetable-name">

                        🥦 ${vegetable.name}

                    </div>


                    <div class="vegetable-info">

                        Price:
                        <strong>
                            ₹${Number(
                                vegetable.pricePerKg
                            ).toFixed(2)}
                            / KG
                        </strong>

                    </div>


                    <div class="vegetable-info">

                        Available Stock:
                        <strong>
                            ${vegetable.quantityKg}
                            KG
                        </strong>

                    </div>


                    <div class="vegetable-info">

                        Farmer:
                        ${vegetable.farmerName || "Farmer"}

                    </div>


                    <div class="quantity-row">


                        <input
                            type="number"
                            id="quantity_${index}"
                            min="1"
                            step="1"
                            value="1"
                        >


                        <select
                            id="unit_${index}"
                        >

                            <option value="kg">
                                KG
                            </option>

                            <option value="gram">
                                Grams
                            </option>

                        </select>


                        <button
                            class="add-btn"
                            onclick="
                                addToCart(
                                    '${vegetable.name}',
                                    ${Number(vegetable.pricePerKg)},
                                    ${Number(vegetable.quantityKg)},
                                    ${index}
                                )
                            "
                        >

                            🛒 Add to Cart

                        </button>


                    </div>

                </div>

            `;

        }
    );

}



// ======================================================
// ADD TO CART
// ======================================================

function addToCart(
    vegetableName,
    pricePerKg,
    stockKg,
    index
) {


    let quantity =
        Number(
            document.getElementById(
                "quantity_" + index
            ).value
        );


    let unit =
        document.getElementById(
            "unit_" + index
        ).value;



    if (
        !quantity ||
        quantity <= 0
    ) {

        alert(
            "Please enter a valid quantity."
        );

        return;
    }



    // Convert grams to KG

    let quantityKg;


    if (unit === "gram") {

        quantityKg =
            quantity / 1000;

    } else {

        quantityKg =
            quantity;

    }



    // Check stock

    if (
        quantityKg >
        Number(stockKg)
    ) {

        alert(
            "Available stock is only " +
            stockKg +
            " KG."
        );

        return;
    }



    // Find existing vegetable

    let existing =
        customerCart.findIndex(
            item =>
                item.name.toLowerCase() ===
                vegetableName.toLowerCase()
        );



    // Maximum 10 different vegetables

    if (
        existing === -1 &&
        customerCart.length >= 10
    ) {

        alert(
            "❌ Maximum 10 vegetables allowed in one order."
        );

        return;
    }



    // If vegetable already exists

    if (existing !== -1) {


        let newQuantity =
            customerCart[existing].quantityKg +
            quantityKg;


        if (
            newQuantity >
            Number(stockKg)
        ) {

            alert(
                "❌ Total quantity exceeds available stock."
            );

            return;
        }


        customerCart[existing].quantityKg =
            newQuantity;

    }

    else {


        customerCart.push({

            name:
                vegetableName,

            pricePerKg:
                Number(pricePerKg),

            quantityKg:
                quantityKg

        });

    }



    saveCart();

    displayCart();



    alert(
        "✅ " +
        vegetableName +
        " added to cart."
    );

}



// ======================================================
// SAVE CART
// ======================================================

function saveCart() {

    localStorage.setItem(
        "customer_cart",
        JSON.stringify(
            customerCart
        )
    );

}



// ======================================================
// FORMAT QUANTITY
// ======================================================

function formatQuantity(
    quantityKg
) {


    if (
        quantityKg < 1
    ) {

        return (
            quantityKg * 1000
        ).toFixed(0) + " g";

    }


    return (
        quantityKg
    ).toFixed(3) + " KG";

}



// ======================================================
// DISPLAY CART
// ======================================================

function displayCart() {


    let section =
        document.getElementById(
            "cartSection"
        );


    let totalBox =
        document.getElementById(
            "cartTotal"
        );


    let orderButton =
        document.getElementById(
            "placeOrderButton"
        );



    if (
        customerCart.length === 0
    ) {


        section.innerHTML = `

            <p style="color:#999;font-style:italic;">
                Your Cart is Empty.
            </p>

        `;


        totalBox.innerHTML = "";

        orderButton.style.display =
            "none";

        return;

    }



    section.innerHTML = "";



    let grandTotal = 0;



    customerCart.forEach(
        (item, index) => {


            let subtotal =
                item.quantityKg *
                item.pricePerKg;


            grandTotal +=
                subtotal;



            section.innerHTML += `

                <div class="cart-item">


                    <div class="cart-item-header">

                        <strong>
                            🥦 ${item.name}
                        </strong>


                        <button
                            class="remove-btn"
                            onclick="
                                removeFromCart(${index})
                            "
                        >

                            ❌ Remove

                        </button>

                    </div>


                    <p>
                        Quantity:
                        <strong>
                            ${formatQuantity(
                                item.quantityKg
                            )}
                        </strong>
                    </p>


                    <p>
                        Price:
                        ₹${item.pricePerKg.toFixed(2)}
                        / KG
                    </p>


                    <p>
                        Subtotal:
                        <strong>
                            ₹${subtotal.toFixed(2)}
                        </strong>
                    </p>

                </div>

            `;

        }
    );



    totalBox.innerHTML = `

        <div class="cart-total">

            🧾 Grand Total:
            ₹${grandTotal.toFixed(2)}

            <br>

            <small>
                ${customerCart.length}
                / 10 vegetables
            </small>

        </div>

    `;



    orderButton.style.display =
        "block";

}



// ======================================================
// REMOVE FROM CART
// ======================================================

function removeFromCart(
    index
) {


    let name =
        customerCart[index].name;


    customerCart.splice(
        index,
        1
    );


    saveCart();

    displayCart();


    alert(
        name +
        " removed from cart."
    );

}



// ======================================================
// PLACE ONE COMPLETE ORDER
// ======================================================

function placeOrder() {


    if (
        customerCart.length === 0
    ) {

        alert(
            "❌ Your cart is empty."
        );

        return;
    }



    // Create ONE order code

    let randomNumber =
        Math.floor(
            1000 +
            Math.random() * 9000
        );


    let orderCode =
        "FF-PEND-" +
        randomNumber;



    // Calculate ONE grand total

    let grandTotal = 0;


    customerCart.forEach(
        item => {

            grandTotal +=

        }

    // Create ONE complete order

    let completeOrder = {

            orderCode,

        customerName:

        customerCart:

            Number(
                grandTotal.toFixed(2)
            ),

        status:
            "Pending",

        orderTime:
            new Date().toLocaleString()

    };



    // Save complete order

    localStorage.setItem(

        )
    );


    // Keep compatibility with existing farmer code

    localStorage.setItem(
        "current_order_status",

    );


    localStorage.setItem(
