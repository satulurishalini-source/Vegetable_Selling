<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Secure Single Table</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; }
        .container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px; width: 100%; max-width: 950px; }
        
        /* 🔒 Login Form Styling */
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 320px; text-align: center; }
        .login-box h2 { margin-bottom: 20px; color: #333; }
        .login-box input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        .login-box button { width: 97%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .login-box button:hover { background-color: #45a049; }
        .error-msg { color: red; font-size: 14px; margin-top: 10px; display: none; }

        /* 📊 Table Styling */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #2E7D32; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .logout-btn { background-color: #f44336; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; float: right; font-weight: bold; }
        
        /* Roles Style */
        .badge-farmer { background-color: #E8F5E9; color: #2E7D32; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 13px; }
        .badge-customer { background-color: #E3F2FD; color: #1565C0; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 13px; }
        .badge-pending { background-color: #FFF3E0; color: #E65100; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 13px; }
        .badge-accepted { background-color: #E8F5E9; color: #1B5E20; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 13px; }

        #adminContent { display: none; width: 100%; max-width: 950px; }
    </style>
</head>
<body>

    <!-- 🔒 1. Admin Login Box -->
    <div class="login-box" id="loginBox">
        <h2>Admin Login 🔐</h2>
        <input type="text" id="adminUser" placeholder="Username">
        <input type="password" id="adminPass" placeholder="Password">
        <button onclick="checkAdminLogin()">Login</button>
        <p class="error-msg" id="errorMsg">తప్పుడు యూజర్‌నేమ్ లేదా పాస్‌వర్డ్!</p>
    </div>

    <!-- 📊 2. Master Dashboard (Single Table) -->
    <div id="adminContent">
        <button class="logout-btn" onclick="adminLogout()">Logout</button>
        <h1>Admin Master Dashboard 📊</h1>

        <div class="container">
            <h2>All Market Transactions & Users (మొత్తం డేటా ఒకే పట్టికలో)</h2>
            <table>
                <thead>
                    <tr>
                        <th>S.No</th>
                        <th>User Name (పేరు)</th>
                        <th>Mobile Number</th>
                        <th>Role (బాధ్యత)</th>
                        <th>Wallet Balance</th>
                        <th>Activity & SMS Bill Details (కూరగాయలు / ధర / ఆర్డర్ వివరాలు)</th>
                    </tr>
                </thead>
                <tbody id="masterTableBody">
                    <!-- Data here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 🔑 1. లాగిన్ వివరాలు మీ పేరుతో మార్చబడ్డాయి (Username: shalini, Password: shalini123)
        const CORRECT_USER = "shalini";
        const CORRECT_PASS = "shalini123";

        function checkAdminLogin() {
            var inputUser = document.getElementById('adminUser').value.trim();
            var inputPass = document.getElementById('adminPass').value.trim();
            var errorMsg = document.getElementById('errorMsg');

            if (inputUser === CORRECT_USER && inputPass === CORRECT_PASS) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                document.body.style.justifyContent = 'flex-start';
                loadSingleTableData();
            } else {
                errorMsg.style.display = 'block';
            }
        }

        function adminLogout() {
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('adminContent').style.display = 'none';
            document.body.style.justifyContent = 'center';
            document.getElementById('adminUser').value = '';
            document.getElementById('adminPass').value = '';
            document.getElementById('errorMsg').style.display = 'none';
        }

        // 🔄 లూప్స్ ఉపయోగించి మొత్తం డేటాని ఒకే టేబుల్‌లోకి తీసుకురావడం
        function loadSingleTableData() {
            var tableBody = document.getElementById('masterTableBody');
            tableBody.innerHTML = ''; 
            var serialNumber = 1;

            // 1. లోకల్ స్టోరేజ్ నుండి యూజర్ల లిస్ట్ లూప్ చేయడం
            var usersList = JSON.parse(localStorage.getItem('veg_market_users')) || [];
            for (var i = 0; i < usersList.length; i++) {
                var roleClass = usersList[i].role === 'FARMER' ? 'badge-farmer' : 'badge-customer';
                
                var row = '<tr>' +
                    '<td>' + (serialNumber++) + '</td>' +
                    '<td><strong>' + (usersList[i].name || 'N/A') + '</strong></td>' +
                    '<td>' + (usersList[i].mobile || 'N/A') + '</td>' +
                    '<td><span class="' + roleClass + '">' + (usersList[i].role || 'USER') + '</span></td>' +
                    '<td>₹' + (usersList[i].balance || '0.00') + '</td>' +
                    '<td><em style="color: #666;">Registered profile</em></td>' +
                '</tr>';
                tableBody.innerHTML += row;
            }

            // 2. లోకల్ స్టోరేజ్ నుండి కూరగాయల లిస్ట్ లూప్ చేయడం
            var vegList = JSON.parse(localStorage.getItem('veg_market_items')) || [];
            for (var j = 0; j < vegList.length; j++) {
                var rowVeg = '<tr>' +
                    '<td>' + (serialNumber++) + '</td>' +
                    '<td><strong>' + (vegList[j].farmer || 'N/A') + '</strong></td>' +
                    '<td>--</td>' +
                    '<td><span class="badge-farmer">FARMER STOCK</span></td>' +
                    '<td>--</td>' +
                    '<td>Added: <strong>' + (vegList[j].name || 'N/A') + '</strong> (' + (vegList[j].quantity || '0') + ' KG) @ ₹' + (vegList[j].price || '0') + '/kg</td>' +
                '</tr>';
                tableBody.innerHTML += rowVeg;
            }

            // 3. 🛒 కస్టమర్ కార్ట్ ఆర్డర్ మరియు లైవ్ SMS బిల్లు ట్రాకింగ్ వివరాలను లూప్ చేయడం
            var orderStatus = localStorage.getItem('current_order_status');
            if (orderStatus && orderStatus !== 'Empty') {
                var lastCode = localStorage.getItem('last_generated_code') || 'FF-PEND-1122';
                var vegName = localStorage.getItem('ordered_vegetable') || 'Fresh Tomatoes';
                var vegQty = localStorage.getItem('ordered_quantity') || '2';
                var vegPrice = localStorage.getItem('ordered_price') || '30';
                var totalAmount = vegQty * vegPrice;
                var acceptedTime = localStorage.getItem('order_accepted_time') || 'Waiting...';
                
                var statusBadge = orderStatus === 'Pending' ? 'badge-pending' : 'badge-accepted';
                var activityText = orderStatus === 'Pending' ? 
                    'Ordered: <strong>' + vegName + '</strong> (' + vegQty + ' KG) - Total: ₹' + totalAmount + '.00 | Status: ⏳ Pending Farmer Acceptance' :
                    'Ordered: <strong>' + vegName + '</strong> (' + vegQty + ' KG) - Total: ₹' + totalAmount + '.00 | 📬 <strong>SMS Bill Dispatched</strong> at ' + acceptedTime;

                var rowOrder = '<tr>' +
                    '<td>' + (serialNumber++) + '</td>' +
                    '<td><strong>' + (localStorage.getItem('customer_name') || 'shalini') + '</strong></td>' +
                    '<td>--</td>' +
                    '<td><span class="' + statusBadge + '">CART ORDER (' + orderStatus.toUpperCase() + ')</span></td>' +
                    '<td>--</td>' +
                    '<td>Code: <strong>' + lastCode + '</strong> | ' + activityText + '</td>' +
                '</tr>';
                tableBody.innerHTML += rowOrder;
            }
        }
    </script>
</body>
</html>
