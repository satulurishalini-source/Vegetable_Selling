<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FreshFarm</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Additional styles specific to register page */
        .register-container {
            min-height: calc(100vh - 150px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 20px;
            background: linear-gradient(135deg, #f1f8e9 0%, #ffffff 100%);
        }

        .register-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
        }

        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .register-header h2 {
            color: #1b5e20;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .register-header p {
            color: #666;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2e7d32;
        }

        .btn-register {
            width: 100%;
            padding: 1rem;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-register:hover {
            background: #1b5e20;
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .login-link a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: inline-block;
            margin-top: 1rem;
            color: #666;
            text-decoration: none;
        }

        .back-home:hover {
            color: #2e7d32;
        }

        .radio-group {
            display: flex;
            gap: 2rem;
            margin-top: 0.5rem;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: normal;
            cursor: pointer;
        }

        .radio-group input[type="radio"] {
            width: auto;
            margin: 0;
        }

        /* Hide the default select and show radio buttons for role? We'll keep select for simplicity */
        /* But we can enhance with radio if desired. We'll keep select for now. */
    </style>
</head>
<body>
    <!-- Simple Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">🥦</span>
                <span class="logo-text"><a href="index.html" style="color: #2e7d32; text-decoration: none;">FreshFarm</a></span>
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
            </div>
        </div>
    </nav>

    <!-- Registration Form -->
    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <h2>Create Account</h2>
                <p>Join FreshFarm today</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="number" id="mobile" placeholder="10-digit mobile number" required>
                </div>

                <div class="form-group">
                    <label for="role">I want to register as</label>
                    <select id="role" required>
                        <option value="">Select Role</option>
                        <option value="FARMER">Farmer</option>
                        <option value="CUSTOMER">Customer</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="balance">Initial Balance (₹)</label>
                    <input type="number" id="balance" placeholder="Enter amount" step="0.01" min="0" required>
                </div>

                <button type="submit" class="btn-register">Register</button>

                <div class="login-link">
                    Already have an account? <a href="login.html">Sign in</a>
                </div>

                <div style="text-align: center; margin-top: 1rem;">
                    <a href="index.html" class="back-home">← Back to Home</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 FreshFarm. All rights reserved.</p>
        </div>
    </footer>

    <script src="app.js"></script>
    <script>
        // Check if user is already logged in - redirect to appropriate dashboard
        (function() {
            const user = getCurrentUser();
            if (user) {
                // Already logged in, redirect to appropriate dashboard
                if (user.role === 'FARMER') {
                    window.location.href = 'farmer.html';
                } else {
                    window.location.href = 'customer.html';
                }
            }
        })();

        // Pre-select role based on URL parameter (e.g., ?role=FARMER)
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const roleParam = urlParams.get('role');
            if (roleParam) {
                const roleSelect = document.getElementById('role');
                if (roleSelect) {
                    // Set the select value if it matches one of the options
                    if (roleParam === 'FARMER' || roleParam === 'CUSTOMER') {
                        roleSelect.value = roleParam;
                    }
                }
            }
        })();

        // Handle form submission
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const role = document.getElementById('role').value;
            const balance = parseFloat(document.getElementById('balance').value);

            // Basic validation
            if (!name || !mobile || !role || isNaN(balance) || balance < 0) {
                alert('Please fill all fields correctly.');
                return;
            }

            // Mobile number validation (simple)
            if (!/^\d{10}$/.test(mobile)) {
                alert('Please enter a valid 10-digit mobile number.');
                return;
            }

            // Call register function from app.js
            if (registerUser(name, mobile, role, balance)) {
                alert('Registration successful! Please login.');
                window.location.href = 'login.html';
            } else {
                alert('Mobile number already registered. Please use a different number or login.');
            }
        });
    </script>
</body>
</html>
